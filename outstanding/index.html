<script>
const SEED = null;
const SB = {"url": "https://ogvltuavclcgbxlyxkhs.supabase.co", "key": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ndmx0dWF2Y2xjZ2J4bHl4a2hzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3MjY4MDAsImV4cCI6MjExMDMwMjgwMH0.M8toXkbQui8TjCacIobkiyew9O-6IrqgZTTzIkQV8Sg"};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ymd = (y,m,d) => y + '-' + String(m).padStart(2,'0') + '-' + String(d).padStart(2,'0');
const dn = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return Math.floor(Date.UTC(y,m-1,d)/864e5); };
const addDays = (s,n) => { const t = new Date((dn(s)+n)*864e5); return ymd(t.getUTCFullYear(), t.getUTCMonth()+1, t.getUTCDate()); };
const TODAY = (() => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth()+1, t.getDate()); })();
const TDN = dn(TODAY);
const fmtD = s => { if (!s) return '—'; const [y,m,d] = s.split('-'); return d + '-' + MON[m-1] + '-' + y; };
const validYMD = (y,m,d) => (m<1||m>12||d<1||d>31) ? null : ymd(y,m,d);
function parseDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date) return ymd(v.getFullYear(), v.getMonth()+1, v.getDate());
  if (typeof v === 'number'){ const p = window.XLSX && XLSX.SSF.parse_date_code(v); return p ? ymd(p.y,p.m,p.d) : null; }
  const s = String(v).trim(); let m;
  if (!s) return null;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return validYMD(+m[1],+m[2],+m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))) { let y = +m[3]; if (y < 100) y += 2000; return validYMD(y,+m[2],+m[1]); }
  if ((m = s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[a-z]*[-\/ ](\d{2,4})$/))) { const mi = MON.findIndex(x => x.toLowerCase() === m[2].toLowerCase()); if (mi < 0) return null; let y = +m[3]; if (y < 100) y += 2000; return validYMD(y, mi+1, +m[1]); }
  return null;
}
const round2 = n => Math.round(n*100)/100;
const money = n => '₹' + Math.trunc(n||0).toLocaleString('en-IN');
const compact = n => { n = n||0; const a = Math.abs(n); if (a >= 1e7) return '₹' + (n/1e7).toFixed(2) + ' Cr'; if (a >= 1e5) return '₹' + (n/1e5).toFixed(2) + ' L'; if (a >= 1e3) return '₹' + (n/1e3).toFixed(1) + ' K'; return '₹' + Math.round(n); };
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const fmtTS = s => { if (!s) return ''; const t = new Date(s); return fmtD(ymd(t.getFullYear(), t.getMonth()+1, t.getDate())) + ' ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0'); };
async function hashPw(pw, salt){
  try { const b = new TextEncoder().encode(salt + ':' + pw); const h = await crypto.subtle.digest('SHA-256', b); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h = 5381; const s = salt + ':' + pw; for (let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))|0; return 'x' + h; }
}

/* ---------- storage (shared db when available, local fallback) ---------- */
const COLS_DB = ['users','entries','followups','payments','activity','edits','meta','chats','billing','wasent','contacts','mailthread','inv_items','inv_brands','inv_cats','inv_subs','inv_units','inv_gst','mat_in','mat_dc','mat_rn','mat_map','cust_addr','mat_ps'];   // contacts: customer To/CC; mailthread: payment mail thread per customer (written by the send-mail service)   // wasent: last WhatsApp alert sent per person + type
const D = {}; COLS_DB.forEach(c => D[c] = new Map());
const hasOut = u => !u || !Array.isArray(u.mods) || u.mods.includes('out'); // Payment Request-only people are not Customer Outstanding users
const ALLU = new Map();   // every user doc (Sales and Purchase), used only by the Create pages
const hasPay = u => !!u && Array.isArray(u.mods) && u.mods.includes('pay');
const uDepts = u => { const d = []; if (hasOut(u)) d.push('Sales'); if (hasPay(u)) d.push('Purchase' + (u.prDept && u.prDept !== 'Purchase' ? ' (' + u.prDept + ')' : '')); return d; };
const anyName = id => (ALLU.get(id) || D.users.get(id))?.name || '';
const loaded = {}; let loadFailed = false;
function norm(snap){
  let docs = snap && snap.docs ? snap.docs : (Array.isArray(snap) ? snap : null);
  if (!docs){ docs = []; if (snap && typeof snap.forEach === 'function') snap.forEach(d => docs.push(d)); }
  return docs.map(d => { const data = typeof d.data === 'function' ? d.data() : (d.data && typeof d.data === 'object' ? d.data : d); return {...data, id: d.id ?? data.id}; });

const Store = {
  mode: 'local', db: null, L: {}, subs: {},
  async startSB(){
    const sb = this.sb;
    const loadAll = async () => {
      let rows = [], a = 0;
      for (;;){ const {data, error} = await sb.from('docs').select('col,id,data').order('col').order('id').range(a, a + 999); if (error) throw error; rows = rows.concat(data); if (data.length < 1000) break; a += 1000; }

      ALLU.clear(); rows.filter(r => r.col === 'users').forEach(r => ALLU.set(r.id, {...r.data, id:r.id}));
      if (D.users.get(S.me)?.role === 'Admin') await this.loadSecrets();
      schedule();
    };
    await loadAll();
    const u = D.users.get(S.me);
    if (u && u.role === 'Admin' && !D.meta.get('seeded') && D.entries.size === 0 && SEED) await this.seedSB();
    if (this.ch) sb.removeChannel(this.ch);
    let first = true;
    this.ch = sb.channel('docs-live').on('postgres_changes', {event:'*', schema:'public', table:'docs'}, p => {
      if (p.eventType === 'DELETE'){ const o = p.old || {}; if (o.col === 'users') ALLU.delete(o.id); if (o.col && D[o.col]){ D[o.col].delete(o.id); schedule(); } }
      else { const n = p.new; if (n && n.col === 'users'){ ALLU.set(n.id, {...n.data, id:n.id}); if (!hasOut(n.data) && D.users.has(n.id)){ D.users.delete(n.id); schedule(); } } if (n && D[n.col] && (n.col !== 'users' || hasOut(n.data))){ D[n.col].set(n.id, {...n.data, id:n.id}); schedule(); } }
    }).subscribe(st => { if (st === 'SUBSCRIBED'){ if (first) first = false; else loadAll().catch(() => {}); } });
  },
  async loadSecrets(){ const {data} = await this.sb.from('user_secrets').select('user_id,pw'); Object.keys(SECRETS).forEach(k => delete SECRETS[k]); (data || []).forEach(r => SECRETS[r.user_id] = r.pw); },
  async seedSB(){
    const rows = SEED.rows.map((r, i) => ({col:'entries', id:'e_seed_' + i, data:{id:'e_seed_' + i, sub:r.s, date:parseDate(r.d), ref:r.r || '', party:r.p, amount:r.a, due:parseDate(r.u), status:'Open'}}));
    rows.push({col:'meta', id:'settings', data:{id:'settings', subgroups:SEED.subs}}, {col:'meta', id:'seeded', data:{id:'seeded', at:nowISO()}}, {col:'activity', id:'a_setup', data:{id:'a_setup', at:nowISO(), by:S.me, byName:'System', action:'Setup', detail:'Invoices loaded'}});
    for (let i = 0; i < rows.length; i += 100){ const {error} = await this.sb.from('docs').upsert(rows.slice(i, i + 100)); if (error) throw error; }
    const {data} = await this.sb.from('docs').select('col,id,data').in('col', ['entries','meta','activity']);
    ['entries','meta','activity'].forEach(c => D[c] = new Map((data || []).filter(r => r.col === c).map(r => [r.id, {...r.data, id:r.id}])));

  async init(){

  apply(col, arr){ D[col] = new Map(arr.map(x => [x.id, x])); loaded[col] = true; schedule(); },

    else { (this.L[col] = this.L[col] || {})[id] = obj; try { localStorage.setItem('cof_local_v1', JSON.stringify(this.L)); } catch(e){} }
  },
  async delAll(col){
    const n = D[col].size; D[col] = new Map(); schedule();

function timeline(e){
  const eds = true ? [...D.edits.values()].filter(h => h.entryId === e.id && mine(h)).map(h => ({at:h.at, t:'edit', f:h})) : [];
  const fus = [...D.followups.values()].filter(f => f.entryId === e.id).map(f => ({at:f.at, t:'fu', f})), pays = [...D.payments.values()].filter(p => p.entryId === e.id).map(p => ({at:p.at, t:'pay', f:p}));
  const items = [...eds, ...fus, ...pays].sort((a,b) => a.at < b.at ? 1 : -1);
  if (!items.length) return '<div class="mut">No follow-ups yet.</div>';
  return items.map(i => i.t === 'edit' ? `<div class="tli edit"><b>${esc(i.f.type)}</b>${(i.f.changes || []).map(c => `<div class="ch">${esc(c.f)}: <s>${esc(c.from)}</s> → <em>${esc(c.to)}</em></div>`).join('')}<div class="m">${fmtTS(i.at)} · ${esc(i.f.byName)}</div></div>` : i.t === 'pay' ? `<div class="tli pay"><b class="num">${money(i.f.amount)}</b> received · ${esc(i.f.mode)}${i.f.ref ? ' · ' + esc(i.f.ref) : ''}<div class="m">${fmtTS(i.at)} · ${esc(uname(i.f.by))}</div></div>`
    : `<div class="tli"><b>${esc(i.f.mode)}</b> · ${esc(i.f.outcomeLabel || i.f.outcome)}${i.f.promiseDate ? ' · promise ' + fmtD(i.f.promiseDate) : ''}${i.f.remark ? `<div>${esc(i.f.remark)}</div>` : ''}<div class="m">${fmtTS(i.at)} · ${esc(uname(i.f.by))}${i.f.next ? ' · next ' + fmtD(i.f.next) : ''}</div></div>`).join('');
}

async function saveFU(id){

  const oc = val('fo'), remark = val('fr'), next = val('fn'), pd = val('fpd');
  if (oc === 'Promised' && !pd){ err.textContent = 'Enter the promise date.'; return; }
  if (!remark && oc !== 'NoResp'){ err.textContent = 'Add a short remark.'; return; }
  const labels = {Contacted:'Spoke / contacted', Promised:'Promised to pay', Disputed:'Disputed', Escalated:'Escalated', NoResp:'No response'};
  const targets = $('#fall').checked ? active([...D.entries.values()].filter(x => visible(x) && x.party === e.party)) : [e];
  const ts = nowISO();
  for (const t of targets){
    await Store.set('followups', uid('f'), {entryId:t.id, party:t.party, sub:t.sub, by:S.me, at:ts, mode:val('fm'), outcome:oc, outcomeLabel:labels[oc], remark, promiseDate:oc === 'Promised' ? pd : '', promiseAmt:oc === 'Promised' ? (targets.length === 1 ? +val('fpa') || t.amount : t.amount) : 0, next});
    const u = {...t, lastFu:ts, lastRemark:remark || t.lastRemark || '', nextFu:next || ''};
    if (oc !== 'NoResp') u.status = oc;
    if (oc === 'Promised'){ u.promiseDate = pd; u.promiseAmt = targets.length === 1 ? (+val('fpa') || t.amount) : t.amount; }
    await Store.set('entries', t.id, u);
  }
  await logAct('Follow-up', `${e.party}: ${labels[oc]}${targets.length > 1 ? ' (' + targets.length + ' invoices)' : ' · ' + (e.ref || '')}`);
  closeDrawer();
}
async function savePay(id){
  const e = D.entries.get(id), err = $('#perr'); err.textContent = '';
  const amt = round2(+val('pa'));
  if (!(amt > 0)){ err.textContent = 'Enter the amount received.'; return; }
  if (amt > e.amount + 0.5){ err.textContent = 'Amount is more than the pending ' + money(e.amount) + '.'; return; }
  await Store.set('payments', uid('p'), {entryId:id, party:e.party, amount:amt, date:val('pd') || TODAY, mode:val('pm'), ref:val('pr'), by:S.me, at:nowISO()});
  const left = round2(e.amount - amt), u = {...e, amount:left};
  if (left <= 0.5){ u.amount = 0; u.status = 'Paid'; u.paidOn = val('pd') || TODAY; u.nextFu = ''; u.promiseDate = ''; u.promiseAmt = 0; }
  await Store.set('entries', id, u);
  await logAct('Payment', `${e.party} ${e.ref || ''}: ${money(amt)}`);
  if (u.status === 'Paid') closeDrawer();
}

async function submitUser(form){
  const id = form.dataset.id, role = form.dataset.role, old = id ? D.users.get(id) : null, err = form.querySelector('#uerr');
  const username = val('uu').toLowerCase().replace(/\s+/g, ''), name = val('un'), pw = val('upw');

  if (phone && !/^[+]?[0-9][0-9 -]{6,16}$/.test(phone)){ err.textContent = 'Enter a valid mobile number (digits only), or leave it empty.'; return; }
  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ err.textContent = 'Enter a valid email ID, or leave it empty.'; return; }
  if (pw && pw.length < 6){ err.textContent = 'Password needs 6 or more characters.'; return; }

  const depts = [...form.querySelectorAll('.udep:checked')].map(x => x.value), sales = !deptUI || depts.includes('Sales'), pur = deptUI && depts.includes('Purchase');

  }

    if (!pick && !prSub){ err.textContent = 'Select a manager.'; return; }

    if (pur && !prSub) u.prManagerId = pick;
    mgr = pick ? (ALLU.get(pick) || D.users.get(pick)) : null;

      if (need.length){
        if (!confirm(`${mgr.name} is not a ${need.join(' and ')} manager yet.\n\nAdd ${mgr.name} to ${need.join(' and ')} as a manager too? This is needed so ${mgr.name} can see this executive's work.`)) return;
        const m2 = {...mgr}; delete m2.id;
        m2.mods = [...new Set([...(Array.isArray(mgr.mods) ? mgr.mods : ['out']), ...(need.includes('Sales') ? ['out'] : []), ...(need.includes('Purchase') ? ['pay'] : [])])];
        if (need.includes('Purchase')){ m2.prRole = 'manager'; if (!m2.prDept || m2.prDept === 'Sub Admin') m2.prDept = u.prDept && u.prDept !== 'Sub Admin' ? u.prDept : 'Purchase'; }

      }
    }
  } else { u.subs = []; delete u.managerId; }
  const aEl = form.querySelector('#ua'); if (aEl) u.active = aEl.checked;

    let msg = error ? error.message : (data && data.error); if (error && error.context && error.context.json){ try { msg = (await error.context.json()).error || msg; } catch(e){} }
    if (msg){ err.textContent = msg; if (btn) btn.disabled = false; return; }
    const full = {...u, id:data.id, username}; ALLU.set(data.id, full); if (hasOut(full)) D.users.set(data.id, full); else D.users.delete(data.id); await Store.loadSecrets();

  }

async function parseWorkbook(file){
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'}); const out = [], skipped = [];
  for (const name of wb.SheetNames){
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
    const hi = aoa.findIndex(r => r && r.some(c => String(c ?? '').trim().toLowerCase() === 'party name'));
    if (hi < 0){ skipped.push(name); continue; }
    const hd = aoa[hi].map(c => String(c ?? '').trim().toLowerCase()), ix = k => hd.indexOf(k);
    const [is0, id, ir, ip, ia, iu] = ['area','date','ref no','party name','pending amount','due on'].map(ix); const is = is0 >= 0 ? is0 : ix('sub group');
    for (const r of aoa.slice(hi + 1)){
      const party = String(r[ip] ?? '').trim(); const a = r[ia];
      if (!party || typeof a !== 'number' || !isFinite(a)) continue;
      out.push({sub:String(r[is] ?? '').trim() || name, date:parseDate(r[id]), ref:String(r[ir] ?? '').trim(), party, amount:round2(a), due:parseDate(r[iu])});
    }
    if (!aoa.slice(hi + 1).some(r => r[ip] && typeof r[ia] === 'number')) out.push({_empty:name});
  }
  return {rows:out.filter(r => !r._empty), sheets:wb.SheetNames.filter(n => !skipped.includes(n)), skipped};
}
const ikey = e => [e.sub.toLowerCase(), (e.ref || '').toLowerCase(), e.party.toLowerCase(), e.ref ? '' : (e.date || '') + '|' + e.amount].join('|');
function planImport(rows, sheets){
  if (!isAdm()){ const known = new Set(allSubs()); rows = rows.filter(r => known.has(r.sub)); sheets = sheets.filter(s => known.has(s)); }
  const ex = new Map([...D.entries.values()].map(e => [ikey(e), e])); const seen = new Set(), plan = {add:[], upd:[], same:0, missing:[]};
  rows.forEach(r => { const k = ikey(r), o = ex.get(k); seen.add(k); if (!o) plan.add.push(r); else if (o.amount !== r.amount || o.date !== r.date || o.due !== r.due || o.status === 'Paid') plan.upd.push({o, r}); else plan.same++; });
  const subSet = new Set(rows.map(r => r.sub).concat(sheets));
  plan.missing = [...D.entries.values()].filter(e => e.status !== 'Paid' && subSet.has(e.sub) && !seen.has(ikey(e)));
  return plan;
}

async function pool(tasks, n, prog){ let i = 0, done = 0; await Promise.all(Array.from({length:n}, async () => { while (i < tasks.length){ const t = tasks[i++]; await t(); prog && prog(++done, tasks.length); } })); }

  else if (t.dataset.chg === 'status'){ const e = D.entries.get(t.dataset.id); if (e && canStat() && sKey(e.status) !== t.value){ const o = {...e, status:t.value}; if (t.value === 'Paid') o.paidOn = TODAY; await Store.set('entries', e.id, o); await logEdit('Edit', e, [{f:'Status', from:sKey(e.status) === 'Open' ? 'Pending' : sKey(e.status), to:t.value === 'Open' ? 'Pending' : t.value}]); } }
  else if (t.dataset.chg === 'remark'){ const e = D.entries.get(t.dataset.id); const v = t.value.trim().slice(0, 200); if (e && (e.remark || '') !== v){ await Store.set('entries', e.id, {...e, remark:v}); await logEdit('Edit', e, [{f:'Remark', from:e.remark || '—', to:v || '—'}]); } }
  else if (t.dataset.chg === 'expdate'){ const e = D.entries.get(t.dataset.id); if (e && canExp() && (expLock(e).open || isTop()) && (e.expectedDate || '') !== t.value && (!t.value || t.value >= TODAY)){ const o = {...e, expectedDate:t.value}; if (!t.value){ o.expSetAt = ''; o.expSetBy = ''; } else if (!e.expSetAt || !e.expectedDate){ o.expSetAt = nowISO(); o.expSetBy = S.me; } await Store.set('entries', e.id, o); await logEdit('Edit', e, [{f:'Expected Payment Date', from:showV('expectedDate', e.expectedDate), to:showV('expectedDate', t.value)}]); } else { forceRender = true; render(); } }
  else if (t.dataset.chg === 'assign'){ const e = D.entries.get(t.dataset.id); await Store.set('entries', e.id, {...e, assignedTo:t.value}); await logEdit('Edit', e, [{f:'Assigned To', from:uname(e.assignedTo) || '—', to:uname(t.value) || '—'}]); await logAct('Assign', `${e.party} ${e.ref || ''} → ${uname(t.value) || 'Unassigned'}`); }
  else if (t.id === 'chimg' && t.files[0]){ try { S.chatImg = await compressImg(t.files[0]); } catch(e){ S.chatImg = null; } t.value = ''; chatPrev(); }
  else if (t.id === 'bfile' && t.files[0]){ const bm = $('#bmsg'); if (bm) bm.textContent = 'Reading…'; try { const rows = await parseBilling(t.files[0]); t.value = ''; if (bm) bm.textContent = ''; if (!rows.length){ if (bm) bm.textContent = 'No billing rows found. Use the sample format.'; return; } billImportModal(rows); } catch(e){ if (bm) bm.textContent = 'Could not read this file.'; } }
  else if (t.id === 'mfile' && t.files[0]){
    const box = $('#mprev'); box.innerHTML = '<span class="mut">Reading…</span>';
    try {
      const r = await parseWorkbook(t.files[0]); const plan = planImport(r.rows, r.sheets);
      if (!r.rows.length){ box.innerHTML = '<div class="note bad">No invoices found. Use the sample format: Area, Date, Ref No, Party Name, Due on, Pending Amount.</div>'; modalImport = null; return; }
      modalImport = {rows:r.rows, plan}; const known = new Set(allSubs()); const newAreas = [...new Set(plan.add.map(x => x.sub))].filter(s => !known.has(s));
      box.innerHTML = `<div class="note info"><b>${plan.add.length}</b> new invoice(s) will be added${plan.add.length ? ' to ' + [...new Set(plan.add.map(x => x.sub))].length + ' area(s)' : ''}. <b>${r.rows.length - plan.add.length}</b> already exist and are skipped.${newAreas.length ? '<br>New area(s) to create: <b>' + esc(newAreas.join(', ')) + '</b>' : ''}</div>${plan.add.length ? '<div style="margin-top:8px"><button type="button" class="btn pri" data-act="applyModalImport">Import ' + plan.add.length + ' invoice(s)</button></div>' : ''}`;
    } catch(e){ box.innerHTML = '<div class="note bad">Could not read this file.</div>'; }
  }
  else if (t.id === 'file' && t.files[0]){
    const box = $('#impprev'); box.innerHTML = '<span class="mut">Reading…</span>';
    try { const r = await parseWorkbook(t.files[0]); pendingImport = {...r, plan:planImport(r.rows, r.sheets)}; if (!r.rows.length){ box.innerHTML = '<div class="note bad">No rows found. Check that the sheet has Party Name and Pending Amount columns.</div>'; pendingImport = null; } else box.innerHTML = importPreview(); }
    catch(e){ box.innerHTML = '<div class="note bad">Could not read this file.</div>'; }
  }
});
document.addEventListener('submit', async ev => {
  const f = ev.target, k = f.dataset.form; if (!k) return; ev.preventDefault();
  if (k === 'login' && SB){
    const un = val('lu').toLowerCase().replace(/\s+/g, ''), btn = f.querySelector('button'); if (btn) btn.disabled = true;
    const {data, error} = await Store.sb.auth.signInWithPassword({email:un + '@cot.app', password:document.getElementById('lp').value});
    if (error){ $('#lerr').textContent = 'Wrong username or password.'; if (btn) btn.disabled = false; return; }
    S.me = data.user.id;
    try { await Store.startSB(); } catch(e){ $('#lerr').textContent = 'Could not load data. Try again.'; if (btn) btn.disabled = false; return; }
    const u = D.users.get(S.me);
    if (!u || u.active === false){ await Store.sb.auth.signOut(); S.me = null; $('#lerr').textContent = 'This account is not active. Ask the Admin.'; if (btn) btn.disabled = false; return; }
    S.view = 'dashboard'; render();
  } else if (k === 'login'){
    const u = [...D.users.values()].find(x => x.username === val('lu').toLowerCase());
    if (!u || u.active === false || await hashPw(val('lp') === '' ? '' : document.getElementById('lp').value, u.salt) !== u.hash){ loginErr = 'Wrong username or password.'; $('#lerr').textContent = loginErr; return; }
    loginErr = ''; S.me = u.id; try { sessionStorage.setItem('cof_me', u.id); } catch(e){} S.view = 'dashboard'; render(); if (u.mustChange && u.role === 'Admin') profileModal(true);
  } else if (k === 'entry') await submitEntry(f);
  else if (k === 'bill') await submitBill();
  else if (k === 'user') await submitUser(f);
  else if (k === 'area') await submitArea();
  else if (k === 'pname'){ const n = val('pfn'); if (!n){ $('#pferr').textContent = 'Name cannot be empty.'; return; } if (n !== me().name){ await Store.set('users', S.me, {...me(), name:n}); await logAct('Edit profile', 'Name changed to ' + n); } closeModal(); }
  else if (k === 'pw'){
    const u = me(), nw = document.getElementById('pw1').value;
    if (nw.length < 6){ $('#perr2').textContent = 'Use 6 or more characters.'; return; }
    if (SB){ const {error} = await Store.sb.auth.updateUser({password:nw}); if (error){ $('#perr2').textContent = error.message; return; } await Store.sb.from('user_secrets').upsert({user_id:u.id, pw:nw}); SECRETS[u.id] = nw; await logAct('Change password', 'Own password changed'); closeModal(); return; }
    if (await hashPw(nw, u.salt) === u.hash){ $('#perr2').textContent = 'New password must be different from the current one.'; return; }
    const salt = uid('s'); await Store.set('users', u.id, {...u, salt, hash:await hashPw(nw, salt), pw:nw, mustChange:false}); await logAct('Change password', 'Own password changed'); closeModal();
  }
});

/* new-version notice (standalone build only) */
(function(){
  if (!SB) return;
  const cur = (document.querySelector('meta[name="app-build"]') || {}).content; if (!cur) return;
  let shown = false;
  function showUpdate(){
    if (shown) return; shown = true;
    const d = document.createElement('div'); d.id = 'updnote'; d.setAttribute('role', 'alertdialog'); d.setAttribute('aria-modal', 'true'); d.setAttribute('aria-labelledby', 'updh');
    d.innerHTML = '<div class="updbox"><div class="updic" aria-hidden="true"><svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></div><h2 id="updh">New update available</h2><p>The app was updated in the background. Please refresh your tab to get the latest version.</p><button class="updok" id="updok">OK, refresh now</button></div>';
    document.body.appendChild(d); const b = document.getElementById('updok'); b.focus(); b.addEventListener('click', () => location.reload());
  }
  async function chk(){
    if (shown) return;
    try { const r = await fetch(location.pathname + '?_=' + Date.now(), {cache:'no-store'}); const x = await r.text(); const m = x.match(/app-build['"] content="([^"]*)"/); if (m && m[1] !== cur) showUpdate(); } catch(e){}
  }
  setInterval(chk, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) chk(); });
})();

/* ---------- admin update announcement ---------- */
let annLast = '';
const ANN_WARN = 60e3, ANN_END = 360e3;
const annState = () => { const a = D.meta.get('announce'); if (!a || !a.active || !a.at) return null; const t = Date.now() - a.at; if (t >= ANN_END) return {a, t, phase:'done'}; return {a, t, phase: t < ANN_WARN ? 'warn' : 'work'}; };
const mmss = ms => { const x = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };
const annAdminHTML = () => { const h = annAdminRaw(); annLast = h; return h; };
function annAdminRaw(){
  if (!isAdm()) return '';
  const st = annState();
  if (!st) return `<div class="annadm" id="annadm"><div class="mut"><b>Update announcement</b><br>Warns every user that an update starts in 1 minute and asks them not to enter anything for 5 minutes.</div><button class="btn pri" data-act="annStart">Announce update (1 min warning)</button></div>`;
  const clock = t => `<span class="annclock" role="timer">${t}</span>`; const msg = st.phase === 'warn' ? 'Announcement is live. Update starts in' : st.phase === 'work' ? 'Users are locked out. App opens again in' : 'The announcement timed out. Users can use the app again.'; const clk = st.phase === 'warn' ? clock(mmss(ANN_WARN - st.t)) : st.phase === 'work' ? clock(mmss(ANN_END - st.t)) : '';
  return `<div class="annadm" id="annadm"><div class="mut"><b>Update announcement</b><br>${msg}</div>${clk}<button class="btn pri" data-act="annClose">${st.phase === 'done' ? 'Clear announcement' : 'OK, update finished — close announcement'}</button></div>`;
}
const annAcked = st => { try { return sessionStorage.getItem('ann_ack') === String(st.a.at); } catch(e){ return false; } };
function annTick(){
  const box = document.getElementById('annc'); if (!box) return;
  const adm = document.getElementById('annadm'); if (adm){ const h = annAdminRaw(); if (h !== annLast){ annLast = h; adm.outerHTML = h; } }
  const st = annState();
  let bar = document.getElementById('annbar');
  const hideBox = () => { if (box.style.display !== 'none'){ box.style.display = 'none'; box.innerHTML = ''; box.dataset.k = ''; } };
  if (!me() || isAdm() || !st || st.phase === 'done' || document.documentElement.classList.contains('embed')){ hideBox(); if (bar) bar.remove(); return; }
  const warn = st.phase === 'warn', left = mmss((warn ? ANN_WARN : ANN_END) - st.t);
  if (warn && annAcked(st)){
    hideBox();
    if (!bar){ bar = document.createElement('div'); bar.id = 'annbar'; bar.setAttribute('role', 'status'); document.body.appendChild(bar); }
    bar.textContent = 'Update starts in ' + left + ' — please do not start anything new.'; return;
  }
  if (bar) bar.remove();
  const html = `<div class="updbox"><div class="updic" aria-hidden="true"><svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>
    <h2>${warn ? 'Update starts in 1 minute' : 'Update in progress'}</h2>
    <div class="annt">${left}</div>
    <p>${warn ? 'We are going to update the app in 1 minute. For the next 5 minutes, please do not submit any request or fill in any details. Press OK and we will save what you have typed.' : 'Please do not submit any request or fill in any details. You can use the app again when the timer ends or when the admin confirms the update is done.'}</p>
    <p class="ann2">${warn ? '1 நிமிடத்தில் அப்டேட் தொடங்குகிறது. அடுத்த 5 நிமிடங்களுக்கு எந்த ரிக்வெஸ்ட்டும் கொடுக்காதீர்கள், எந்த விவரத்தையும் நிரப்பாதீர்கள். OK அழுத்தினால் நீங்கள் டைப் செய்தது சேமிக்கப்படும்.' : 'அப்டேட் நடைபெறுகிறது. எதையும் நிரப்ப வேண்டாம். நேரம் முடிந்ததும் மீண்டும் பயன்படுத்தலாம்.'}</p>
    ${warn ? (annAcked(st) ? '<p><b>Saved ✓</b></p>' : '<button class="updok" data-act="annOk" id="annok">OK</button>') : ''}</div>`;
  const k = (warn ? 'w' : 'k') + (warn && annAcked(st) ? 's' : '');
  if (box.dataset.k !== k || box.style.display === 'none'){ box.dataset.k = k; box.innerHTML = html; box.style.display = 'grid'; const ok = document.getElementById('annok'); if (ok) ok.focus(); }
  else { const t = box.querySelector('.annt'); if (t) t.textContent = left; }
}
setInterval(annTick, 1000);

/* ---------- portal embed: when opened inside the portal, hide own sidebar and let the portal drive the menu ---------- */
(function(){
  if (window.parent === window || !/[?&]embed=1/.test(location.search)) return;
  const st = document.createElement('style');
  st.textContent = '.side,.tg,.tgh{display:none!important}.shell{flex-direction:row!important}.pbell{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid #e3e7ee;background:#fff;cursor:pointer;display:grid;place-items:center;color:#3d3d57;flex:none;margin-right:10px;margin-left:auto;box-shadow:0 2px 8px rgba(40,30,120,.08)}.pbell+.prof{margin-left:0!important}.pbell svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.pbell .nb{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#c0392b;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}';
  document.head.appendChild(st);
  let last = '';
  function items(){
    const missedN = isTop() ? scoped().filter(missed).length : 0;
    return NAV.filter(n => n[3]()).map(n => {
      const it = {k:n[0], label:n[1]};
      if (n[0] === 'create') it.children = (isAdm() ? ['Area','Sub Admin','Manager','Executive'] : ['Area','Manager','Executive']).map(r => ({k:'create', role:r, label:r}));
      if (n[0] === 'chat') it.badge = chatUnread();
      if (n[0] === 'outstanding' && isTop()) it.badge = missedN;
      return it;
    });
  }
  function emit(){
    try {
      const ok = !!(typeof me === 'function' && me() && me().active !== false);
      const msg = {type:'portal-nav', mod:'outstanding', items: ok ? items() : [], view: S.view, role: S.view === 'create' ? F.cr : null};
      const j = JSON.stringify(msg); if (j === last) return; last = j;
      parent.postMessage(msg, location.origin);
    } catch(e){}
  }
  const _render = render;

 /* portal bell: sits left of the user card; the portal shell owns the list and the pop-ups */
 var BELLN=0,BSVG='<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 21a1.94 1.94 0 003.4 0"/></svg>';
 function bellHTML(){return BSVG+(BELLN?'<span class="nb">'+(BELLN>99?'99+':BELLN)+'</span>':'')}
 function ensureBell(){var card=document.querySelector('#main .prof');if(!card)return;var b=card.previousElementSibling;if(!b||!b.classList||!b.classList.contains('pbell')){b=document.createElement('button');b.type='button';b.className='pbell';b.title='Notifications';b.setAttribute('aria-label','Notifications');b.addEventListener('click',function(e){e.stopPropagation();try{parent.postMessage({type:'portal-bell'},location.origin)}catch(x){}});card.parentNode.insertBefore(b,card)}b.innerHTML=bellHTML()}
 addEventListener('message',function(ev){if(ev.origin!==location.origin||ev.source!==parent)return;var d=ev.data;if(d&&d.type==='portal-badge'){BELLN=+d.n||0;ensureBell()}});
 try{parent.postMessage({type:'portal-ready'},location.origin)}catch(x){}
  render = function(){ _render.apply(this, arguments); emit(); ensureBell(); };
  addEventListener('message', ev => {
    if (ev.origin !== location.origin || ev.source !== parent) return;
    const d = ev.data; if (!d || d.type !== 'portal-go') return;
    const k = String(d.k || ''); if (!NAV.filter(n => n[3]()).some(n => n[0] === k)) return;
    const t = {dataset:{k}}; if (k === 'create' && d.role) t.dataset.role = String(d.role);
    ACT.nav(t);
  });
  emit();
})();
